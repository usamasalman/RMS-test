version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: grc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grc_password_dev}
      POSTGRES_DB: ${POSTGRES_DB:-grc_wisdom}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - grc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grc_user} -d ${POSTGRES_DB:-grc_wisdom}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PgAdmin (Optional - for database management UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: grc-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@grc.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - grc-network
    depends_on:
      - postgres

  # Backend API (Node.js + Express)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: grc-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-grc_user}:${POSTGRES_PASSWORD:-grc_password_dev}@postgres:5432/${POSTGRES_DB:-grc_wisdom}
      JWT_SECRET: ${JWT_SECRET:-super_secret_grc_key_for_dev}
    ports:
      - "${PORT:-3001}:3001"
      - "${VITE_HMR_PORT:-3002}:3002"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    networks:
      - grc-network
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run dev

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  grc-network:
    driver: bridge
